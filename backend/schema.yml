components:
  schemas:
    AuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: string
          format: uuid
          nullable: true
        actor_name:
          type: string
          readOnly: true
        actor_email:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 100
        entity_name:
          type: string
          maxLength: 100
        entity_id:
          type: string
          maxLength: 100
        details: {}
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - actor_name
      - created_at
      - id
    Bill:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: string
          format: uuid
        customer_name:
          type: string
          readOnly: true
        dairy:
          type: string
          format: uuid
        dairy_name:
          type: string
          readOnly: true
        billing_month:
          type: string
          format: date
          description: First date of the billing month e.g. 2026-09-01
        month_name:
          type: string
          readOnly: true
        total_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        paid_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        due_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/BillStatusEnum'
        due_date:
          type: string
          format: date
          nullable: true
        paid_at:
          type: string
          format: date-time
          nullable: true
        pdf_url:
          type: string
          readOnly: true
        is_paid:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - billing_month
      - created_at
      - customer
      - customer_name
      - dairy
      - dairy_name
      - id
      - is_paid
      - items
      - month_name
      - pdf_url
    BillItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        item_name:
          type: string
          maxLength: 200
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
      required:
      - date
      - id
      - item_name
      - quantity
      - total_amount
      - unit_price
    BillStatusEnum:
      enum:
      - generated
      - partially_paid
      - paid
      - overdue
      type: string
      description: |-
        * `generated` - Generated

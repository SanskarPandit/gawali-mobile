      parameters:
      - in: path
        name: customer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/billing/vendor/mark-paid/{id}/:

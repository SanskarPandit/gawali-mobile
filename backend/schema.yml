      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bill'
          description: ''
  /api/v1/billing/vendor/generate/{customer_id}/:
    post:
      operationId: billing_vendor_generate_create
      description: Vendor generates or regenerates a bill for a customer for a given

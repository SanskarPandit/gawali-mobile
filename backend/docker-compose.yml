services:
  db:
    image: postgres:16-alpine
    container_name: gawali_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-gawali_db}
      POSTGRES_USER: ${DB_USER:-gawali_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gawali_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gawali_user} -d ${DB_NAME:-gawali_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gawali_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: gawali_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_gawali &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build: .
    container_name: gawali_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - api
      - redis

  celery_beat:
    build: .
    container_name: gawali_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - api
      - redis

volumes:
  postgres_data:
  redis_data:

name: Gawali Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Quality (Django 5.1 / Python 3.12)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Checks & Migrations
        working-directory: ./backend
        env:
          SECRET_KEY: 'ci-secret-key-test'
          DEBUG: '1'
        run: |
          python manage.py check
          python manage.py migrate --noinput

      - name: Run Pytest Suite with Coverage
        working-directory: ./backend
        env:
          SECRET_KEY: 'ci-secret-key-test'
          DEBUG: '1'
        run: |
          pytest -v

  mobile-typecheck:
    name: Mobile Typecheck & Unit Tests (React Native CLI Fabric)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./mobile/package.json

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        working-directory: ./mobile
        run: npm run typecheck

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Verify Android Gradle Wrapper
        working-directory: ./mobile/android
        run: ./gradlew tasks --no-daemon

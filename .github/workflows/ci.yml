name: Gawali Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests & Quality (Django 5.1 / Python 3.12)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Django Checks & Migrations
        working-directory: ./backend
        env:
          # The settings read DJANGO_* names. CI has no .env, so pin a throwaway key and a local SQLite database.
          DJANGO_SECRET_KEY: 'ci-only-secret-key-not-used-anywhere-else-0123456789'
          DJANGO_DEBUG: 'True'
          DB_ENGINE: 'sqlite'
        run: |
          python manage.py check
          python manage.py migrate --noinput

      - name: Run Pytest Suite with Coverage
        working-directory: ./backend
        env:
          # The settings read DJANGO_* names. CI has no .env, so pin a throwaway key and a local SQLite database.
          DJANGO_SECRET_KEY: 'ci-only-secret-key-not-used-anywhere-else-0123456789'
          DJANGO_DEBUG: 'True'
          DB_ENGINE: 'sqlite'
        run: |
          pytest -v

  web-build:
    name: Web App Typecheck & Build (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./web/package-lock.json

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        working-directory: ./web
        run: npm run build

  mobile-typecheck:
    name: Mobile Typecheck & Unit Tests (React Native CLI Fabric)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./mobile/package.json

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        working-directory: ./mobile
        run: npm run typecheck

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Verify Android Gradle Wrapper
        working-directory: ./mobile/android
        # Commits from Windows drop the executable bit on gradlew; restore it on the runner.
        run: |
          chmod +x ./gradlew
          ./gradlew tasks --no-daemon
